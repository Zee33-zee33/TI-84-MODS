name: Build Engine

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-host:
    name: Build for Host Platform
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Build engine
      run: make build
    
    - name: Run smoke test
      run: ./bin/engine_smoke
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: engine-host-build
        path: bin/engine_smoke
        
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build-host
    if: always()
    
    permissions:
      contents: read
    
    steps:
    - name: Check build result
      run: |
        if [ "${{ needs.build-host.result }}" == "success" ]; then
          echo "✓ Build successful!"
          exit 0
        else
          echo "✗ Build failed"
          exit 1
        fi
