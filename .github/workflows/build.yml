name: Build Engine

on:
  push:
    branches: [ main, agent/engine/skeleton ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        pip3 install Pillow
    
    - name: Build engine
      run: make build-engine
    
    - name: Run smoke test
      run: make test-engine
